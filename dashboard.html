function saveMethRaw(){var raw=document.getElementById('methRaw').value;var art=document.getElementById('methArticle').value;saveMethDoc(raw,art,'素材已保存')}

function generateMethArticle(){var raw=document.getElementById('methRaw').value;if(raw.replace(/\s/g,'').length<20){alert('请先粘贴至少 20 个字的方法论素材');return}var art=composeMethodology(raw);document.getElementById('methArticle').value=art;switchMethTab('article');saveMethDoc(raw,art,'已汇总成文并保存')}
function copyMethArticle(){var art=document.getElementById('methArticle').value;if(!art.trim()){alert('暂无成文内容');return}var hint=document.getElementById('methHint');var done=function(){if(hint)hint.textContent='已复制成文'};var fallback=function(){var ta=document.createElement('textarea');ta.value=art;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){alert('复制失败，请手动选择文本')}document.body.removeChild(ta)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(art).then(done).catch(fallback)}else{fallback()}}
function exportMethArticle(){var art=document.getElementById('methArticle').value;if(!art.trim()){alert('暂无成文内容');return}var blob=new Blob([art],{type:'text/markdown;charset=utf-8'});var a=document.createElement('a');var d=new Date();a.href=URL.createObjectURL(blob);a.download='宏观数据跟踪-方法论-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'.md';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},100);var h=document.getElementById('methHint');if(h)h.textContent='已导出 Markdown'}
function buildDoc(D){
  var H=D.data_health||{},stale=H.stale||[],failed=H.failed_items||[];
  var h='<div class="doc-head"><h3>数据更新说明</h3><button class="doc-close" onclick="closeDoc()" aria-label="关闭">×</button></div>';
  h+='<div class="doc-meta">最近更新 '+escHtml(D.update_time||'--')+' · 指标 '+(H.total||0)+' 个 · 陈旧 '+stale.length+' 项'+(failed.length?' · 采集失败 '+failed.length+' 项':'')+'</div>';
  h+='<div class="doc-sec"><b>更新流程</b><ul class="doc-list"><li>点「同步更新」依次运行：采集数据 → 分析引擎 → 数据自检，全部通过后页面自动刷新。</li><li>数据来自 akshare 封装的统计局、交易所等公开源；源端未发布新一期时，该指标只能停留在上一期。</li></ul></div>';
  h+='<div class="doc-sec"><b>陈旧判定</b><ul class="doc-list"><li>按频率设阈值：每日 10 天、月度 75 天、季度 150 天，最新数据超过阈值即标为陈旧。</li><li>陈旧指标保留明细与相关系数，但不参与合成指数和信号汇总，避免旧数据扭曲判断。</li><li>月度阈值卡在发布空窗期，每月月中有若干指标会短暂被判为陈旧，等下月数据发布后自动恢复。</li></ul></div>';
  if(stale.length){
    h+='<div class="doc-sec"><b>未更新理由（'+stale.length+' 项）</b><div class="doc-table-wrap"><table class="doc-table"><tr><th>指标</th><th>分类</th><th>最新数据</th><th>距今 / 阈值</th><th>理由</th></tr>';
    stale.forEach(function(x){
      h+='<tr><td>'+escHtml(x.name)+'</td><td>'+(CAT_CN[x.category]||escHtml(x.category))+' · '+escHtml(x.freq||'')+'</td><td>'+escHtml(x.latest_date||'')+'</td><td>'+(x.age_days==null?'--':x.age_days+' 天')+(x.stale_limit?' / '+x.stale_limit+' 天':'')+'</td><td>'+escHtml(x.reason||'上游数据源未更新')+'</td></tr>';
    });
    h+='</table></div></div>';
  }else{
    h+='<div class="doc-sec"><b>未更新理由</b><div class="doc-ok">全部指标均在阈值内，暂无陈旧数据。</div></div>';
  }
  if(failed.length){
    h+='<div class="doc-sec"><b>采集失败（'+failed.length+' 项）</b><ul class="doc-list">';
    failed.forEach(function(x){h+='<li>'+escHtml(typeof x==='string'?x:(x.name||x.id||'未知'))+'</li>'});
    h+='</ul></div>';
  }
  var ignN=ignoredTotalCount();
  h+='<div class="doc-sec"><b>已忽略的文章</b><div class="doc-ok">'+(ignN?('已忽略 '+ignN+' 条。'):'暂无忽略记录。')+' <button class="mv-mini" type="button" onclick="openIgnoredList()">查看 / 恢复</button></div></div>';
  var m=document.getElementById('docMask');
  if(!m){
    m=document.createElement('div');m.id='docMask';m.className='doc-mask';
    m.onclick=function(e){if(e.target===m)closeDoc()};
    m.innerHTML='<div class="doc-panel" id="docPanel"></div>';
    document.body.appendChild(m);
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDoc()});
  }
  document.getElementById('docPanel').innerHTML=h;
}
function openDoc(){if(window.__APP_DATA)buildDoc(window.__APP_DATA);var m=document.getElementById('docMask');if(m)m.classList.add('open')}
function closeDoc(){var m=document.getElementById('docMask');if(m)m.classList.remove('open')}
function pollUpdateStatus(){var b=document.getElementById('syncBtn');var iv=setInterval(function(){fetch('/api/status').then(function(r){return r.json()}).then(function(s){if(s.running){if(s.current_step)b.textContent='更新中 '+s.current_step;return}clearInterval(iv);b.textContent='同步更新';b.disabled=false;b.classList.remove('updating');if(s.last_result&&s.last_result.success){b.textContent='已更新';setTimeout(function(){b.textContent='同步更新'},3000);location.reload()}else{b.textContent='更新失败';setTimeout(function(){b.textContent='同步更新'},3000)}})},3000);setTimeout(function(){clearInterval(iv);b.textContent='同步更新';b.disabled=false;b.classList.remove('updating')},120000)}
(function(){function showHint(){document.body.insertAdjacentHTML('afterbegin','<div style="position:fixed;inset:0;z-index:99999;background:#f4f6fa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#1f2937;font-family:system-ui,sans-serif;text-align:center;padding:24px;"><h2 style="color:#0b7fab;">未找到数据文件</h2><p style="color:#5b6b7f;max-width:480px;line-height:1.8;">请先采集一次数据：双击项目目录下的 <b>start.bat</b> 启动服务，访问 http://localhost:4321 并点击"同步更新"。</p></div>')}var s=document.createElement('script');s.src='data/analysis_data.js?v='+Date.now();s.onload=function(){if(window.__ANALYSIS_DATA__){initApp(window.__ANALYSIS_DATA__);maybeAutoSync()}else{showHint()}};s.onerror=showHint;document.head.appendChild(s)})();
</script>
